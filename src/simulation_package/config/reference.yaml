# Reference only. This file is not loaded by the simulator.
# Runtime defaults live in simulation_package/simulation_config.py; every key here is at its default.

simulator: newton

# Scene XML/MJCF for the environment. Empty for a bare ground plane.
scene: package://simulation_package/assets/lite3_mjcf/mjcf/stairs_floors.xml

# Run without a viewer by default.
headless: true

robot:
  model: lite3  # lite3 or m20; picks the robot description
  state_frequency_hz: 50.0
  # Spawn pose in the scene's frame (metres, yaw in radians); unset fields keep the default start.
  start_pose: {x: null, y: null, yaw: null}

sensors:
  lidar_2d:
    enabled: false
    site_name: lidar_site
    frame_id: lidar
    topic: /scan
    frequency_hz: 10.0
    num_rays: 360
    range_min: 0.15
    range_max: 8.0
    visualize_rays: false

  follow_camera:
    enabled: false
    video_path: ''
    fps: 20.0
    width: 800
    height: 600
    distance_m: 4.0
    elevation_deg: -18.0
    azimuth_offset_deg: 60.0
    target_height_m: 0.55
    smoothing: 0.08
    quality: 8
    fov_deg: 45.0
    follow_yaw: true

  # A second video with the same options, e.g. a top-down view that keeps the map's heading.
  overhead_camera:
    enabled: false
    video_path: ''
    elevation_deg: -89.0
    follow_yaw: false
    distance_m: 10.0

rerun:
  enabled: false
  spawn: true
  save_path: ''
  close_viewer_on_exit: false
