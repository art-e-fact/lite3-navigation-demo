# Reference only. This file is not loaded by the simulator.
# Runtime defaults live in interface/robot/simulation/simulation_config.py.

simulator: newton

# Scene XML/MJCF for the environment.
scene: package://lite3_sdk_deploy/Lite3_description/lite3_mjcf/mjcf/stairs_floors.xml

# Robot description.
robot_description: package://lite3_sdk_deploy/Lite3_description/lite3_mjcf/mjcf/Lite3.xml

# Run without a viewer by default.
headless: true

sensors:
  lidar_2d:
    enabled: false
    site_name: lidar_site
    frame_id: lidar
    topic: /scan
    frequency_hz: 10.0
    num_rays: 360
    range_min: 0.15
    range_max: 8.0
    visualize_rays: false

  follow_camera:
    enabled: false
    video_path: ''
    fps: 20.0
    width: 800
    height: 600
    distance_m: 4.0
    elevation_deg: -18.0
    azimuth_offset_deg: 60.0
    target_height_m: 0.55
    smoothing: 0.08
    quality: 8
    follow_yaw: true

  # A second video with the same options, e.g. a top-down view that keeps the map's heading.
  overhead_camera:
    enabled: false
    video_path: ''
    elevation_deg: -89.0
    follow_yaw: false
    distance_m: 10.0

rerun:
  enabled: false
  spawn: true
  save_path: ''